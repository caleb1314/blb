<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Call - Hajimi Edition</title>
    <style>
        :root {
            --ios-red: #ff3b30;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }

        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; color: #fff; }

        /* === 视频背景 === */
        #video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* === 顶栏：左(历史) 中(备注) 右(设置) === */
        .top-nav {
            position: absolute; top: calc(env(safe-area-inset-top) + 10px);
            left: 0; width: 100%; z-index: 50;
            display: grid; grid-template-columns: 80px 1fr 80px; align-items: center;
            padding: 0 16px;
        }

        .nav-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--glass); backdrop-filter: blur(15px);
            border: 0.5px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .nav-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; }

        .center-info { text-align: center; }
        .caller-name { font-size: 18px; font-weight: 600; text-shadow: var(--text-shadow); }
        .call-timer { font-size: 12px; opacity: 0.9; font-variant-numeric: tabular-nums; text-shadow: var(--text-shadow); }

        /* === 乙游式字幕消息 (中下方) === */
        .subtitle-area {
            position: absolute; bottom: 22%; left: 10%; right: 10%;
            z-index: 100; text-align: center; pointer-events: none;
            min-height: 60px; display: flex; align-items: center; justify-content: center;
        }
        .subtitle-text {
            font-size: 18px; font-weight: 500; line-height: 1.6;
            color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 1px 2px rgba(0,0,0,1);
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0; transform: translateY(10px);
        }
        .subtitle-text.active { opacity: 1; transform: translateY(0); }

        /* === 底部交互区 === */
        .bottom-wrap {
            position: absolute; bottom: calc(env(safe-area-inset-bottom) + 20px);
            left: 0; width: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        /* 隐藏式输入框 */
        .input-bar {
            width: 85%; max-width: 400px; height: 44px;
            background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(20px);
            border-radius: 22px; border: 0.5px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; padding: 0 6px 0 16px;
        }
        .chat-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #fff; font-size: 15px;
        }
        .chat-input::placeholder { color: rgba(255,255,255,0.4); }
        
        .send-mini-btn {
            width: 32px; height: 32px; border-radius: 50%; background: #fff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .send-mini-btn svg { width: 16px; height: 16px; stroke: #000; fill: none; stroke-width: 2.5; }

        /* 控制按键 */
        .controls-row { display: flex; align-items: center; gap: 40px; }
        .ctrl-btn {
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .btn-mute { background: var(--glass); border: 0.5px solid var(--glass-border); backdrop-filter: blur(15px); }
        .btn-hangup { background: var(--ios-red); }
        .ctrl-btn svg { width: 24px; height: 24px; }

        /* === 历史记录面板 (侧滑) === */
        .history-drawer {
            position: fixed; top: 0; left: 0; width: 80%; height: 100%;
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(25px);
            z-index: 200; transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column; padding: 60px 20px 40px;
        }
        .history-drawer.active { transform: translateX(0); }
        .history-title { font-size: 13px; font-weight: 800; color: #888; letter-spacing: 2px; margin-bottom: 20px; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scrollbar-width: none; }
        .history-list::-webkit-scrollbar { display: none; }
        
        .history-item { font-size: 14px; line-height: 1.5; padding-bottom: 10px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .h-role { font-weight: 800; font-size: 11px; margin-bottom: 4px; color: #aaa; text-transform: uppercase; }
        .h-content { color: #eee; }

        /* === 配置弹窗 (主界面同款) === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .config-card {
            width: 100%; max-width: 320px; background: rgba(255, 255, 255, 0.9);
            border-radius: 20px; padding: 24px; color: #1c1c1e; display: flex; flex-direction: column; gap: 14px;
        }
        .config-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #f5f5f7; font-size: 14px; outline: none; }
        .save-btn { width: 100%; padding: 12px; border-radius: 10px; background: #000; color: #fff; font-weight: 600; border: none; cursor: pointer; }

        canvas#capture-canvas { display: none; }
    </style>
</head>
<body>

    <div id="video-container"><video id="video-el" autoplay playsinline></video></div>

    <!-- 导航 -->
    <div class="top-nav">
        <div class="nav-btn" onclick="toggleHistory(true)">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        </div>
        <div class="center-info">
            <div class="caller-name">宝宝</div>
            <div class="call-timer" id="call-timer">00:00</div>
        </div>
        <div class="nav-btn" onclick="toggleConfig(true)">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
    </div>

    <!-- 字幕区 -->
    <div class="subtitle-area">
        <div class="subtitle-text" id="subtitle-el"></div>
    </div>

    <!-- 底部 -->
    <div class="bottom-wrap">
        <div class="input-bar">
            <input type="text" class="chat-input" id="chat-input" placeholder="说点什么..." autocomplete="off">
            <div class="send-mini-btn" onclick="handleSend()">
                <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
            </div>
        </div>
        <div class="controls-row">
            <div class="ctrl-btn btn-mute"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18.5V22M8 22h8"/></svg></div>
            <div class="ctrl-btn btn-hangup" onclick="history.back()"><svg viewBox="0 0 24 24" fill="#fff"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
        </div>
    </div>

    <!-- 历史侧滑栏 -->
    <div class="history-drawer" id="history-drawer" onclick="toggleHistory(false)">
        <div class="history-title">HISTORY LOG</div>
        <div class="history-list" id="history-list" onclick="event.stopPropagation()"></div>
    </div>

    <!-- 配置弹窗 -->
    <div class="modal-overlay" id="config-modal">
        <div class="config-card">
            <h3 style="text-align:center">Settings</h3>
            <input type="text" class="config-input" id="api-url" placeholder="API URL">
            <input type="password" class="config-input" id="api-key" placeholder="API Key">
            <input type="text" class="config-input" id="api-model" placeholder="Model (e.g. gpt-4o)">
            <textarea class="config-input" id="api-persona" style="height:80px" placeholder="人设设定..."></textarea>
            <button class="save-btn" onclick="saveSettings()">Save</button>
            <button class="save-btn" style="background:#eee; color:#333; margin-top:0" onclick="toggleConfig(false)">Cancel</button>
        </div>
    </div>

    <canvas id="capture-canvas"></canvas>

    <script>
        const video = document.getElementById('video-el');
        const canvas = document.getElementById('capture-canvas');
        const subtitleEl = document.getElementById('subtitle-el');
        const chatInput = document.getElementById('chat-input');
        const historyList = document.getElementById('history-list');
        
        let callHistory = []; // 用于历史回顾

        // --- 1. 摄像头 ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
            } catch (err) { alert("摄像头权限被拒绝"); }
        }

        // --- 2. 字幕显示逻辑 ---
        function displaySubtitle(text) {
            subtitleEl.classList.remove('active');
            setTimeout(() => {
                subtitleEl.innerText = text;
                subtitleEl.classList.add('active');
            }, 300);
        }

        // --- 3. 截取当前帧 ---
        function getFrameBase64() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
        }

        // --- 4. API 调用 ---
        async function handleSend() {
            const text = chatInput.value.trim();
            if(!text) return;

            const config = JSON.parse(localStorage.getItem('hajimi_video_api') || '{}');
            if(!config.key) return alert("请先在设置中配置 API Key");

            // 1. 用户消息上屏并记录
            displaySubtitle(text);
            addToHistory('User', text);
            chatInput.value = '';
            chatInput.blur();

            // 2. 准备视觉请求
            const base64Img = getFrameBase64();
            let fetchUrl = config.url || 'https://api.openai.com/v1';
            if (!fetchUrl.endsWith('/chat/completions')) fetchUrl = fetchUrl.replace(/\/+$/, '') + '/chat/completions';

            const payload = {
                model: config.model || "gpt-4o",
                messages: [
                    { role: "system", content: (config.persona || "你正在和用户视频。") + "。请观察画面回复，不要输出动作描述，只输出口语。"},
                    { role: "user", content: [
                        { type: "text", text: text },
                        { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64Img}` } }
                    ]}
                ],
                max_tokens: 200
            };

            try {
                const res = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.key}` },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                const aiText = data.choices[0].message.content;
                
                // 3. AI回复上屏
                setTimeout(() => {
                    displaySubtitle(aiText);
                    addToHistory('Char', aiText);
                }, 800);

            } catch (err) {
                displaySubtitle("连接中断...");
            }
        }

        // --- 5. 辅助功能 ---
        function addToHistory(role, content) {
            callHistory.push({ role, content });
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<div class="h-role">${role}</div><div class="h-content">${content}</div>`;
            historyList.appendChild(item);
            historyList.scrollTop = historyList.scrollHeight;
        }

        function toggleHistory(show) { document.getElementById('history-drawer').classList.toggle('active', show); }
        function toggleConfig(show) { document.getElementById('config-modal').classList.toggle('active', show); }

        function saveSettings() {
            const config = {
                url: document.getElementById('api-url').value,
                key: document.getElementById('api-key').value,
                model: document.getElementById('api-model').value,
                persona: document.getElementById('api-persona').value
            };
            localStorage.setItem('hajimi_video_api', JSON.stringify(config));
            toggleConfig(false);
        }

        // 计时器
        let seconds = 0;
        setInterval(() => {
            seconds++;
            let m = Math.floor(seconds/60).toString().padStart(2,'0');
            let s = (seconds%60).toString().padStart(2,'0');
            document.getElementById('call-timer').innerText = `${m}:${s}`;
        }, 1000);

        window.onload = () => {
            initCamera();
            const config = JSON.parse(localStorage.getItem('hajimi_video_api') || '{}');
            document.getElementById('api-url').value = config.url || '';
            document.getElementById('api-key').value = config.key || '';
            document.getElementById('api-model').value = config.model || '';
            document.getElementById('api-persona').value = config.persona || '';
        };

        // 监听回车
        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
