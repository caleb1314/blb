<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Call - Hajimi Edition</title>
    <style>
        :root {
            --ios-red: #ff3b30;
            --ios-green: #34c759;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }

        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; color: #fff; }

        /* === 待接听界面 (层级最高) === */
        #incoming-call {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #2c3e50, #000000);
            z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 80px 0 100px; transition: opacity 0.5s ease;
        }
        .caller-avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: url('https://file.uhsea.com/2602/70da4faf682de2817a4b430809e0bce3NN.jpg') center/cover;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .incoming-name { font-size: 28px; font-weight: 600; margin-top: 20px; }
        .incoming-tip { font-size: 14px; opacity: 0.6; margin-top: 10px; }
        .call-actions { display: flex; gap: 80px; }
        .action-btn {
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
        }
        .icon-circle {
            width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .icon-circle.decline { background: var(--ios-red); }
        .icon-circle.accept { background: var(--ios-green); }
        .icon-circle svg { width: 32px; height: 32px; fill: #fff; }

        /* === 视频背景 === */
        #video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* === 顶栏 === */
        .top-nav {
            position: absolute; top: calc(env(safe-area-inset-top) + 10px);
            left: 0; width: 100%; z-index: 50;
            display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; padding: 0 16px;
            display: none; /* 初始隐藏 */
        }
        .nav-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--glass); backdrop-filter: blur(15px); border: 0.5px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; }
        .center-info { text-align: center; }
        .caller-name { font-size: 18px; font-weight: 600; text-shadow: var(--text-shadow); }
        .call-timer { font-size: 12px; opacity: 0.9; text-shadow: var(--text-shadow); }

        /* === 字幕消息 === */
        .subtitle-area {
            position: absolute; bottom: 22%; left: 10%; right: 10%;
            z-index: 100; text-align: center; pointer-events: none;
            min-height: 60px; display: flex; align-items: center; justify-content: center;
        }
        .subtitle-text {
            font-size: 18px; font-weight: 500; line-height: 1.6;
            color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            opacity: 0; transform: translateY(10px); transition: all 0.3s ease;
        }
        .subtitle-text.active { opacity: 1; transform: translateY(0); }

        /* === 底部交互 === */
        .bottom-wrap {
            position: absolute; bottom: calc(env(safe-area-inset-bottom) + 20px);
            left: 0; width: 100%; z-index: 100; display: none;
            flex-direction: column; align-items: center; gap: 20px;
        }
        .input-bar {
            width: 85%; max-width: 400px; height: 44px;
            background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(20px);
            border-radius: 22px; border: 0.5px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; padding: 0 6px 0 16px;
        }
        .chat-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; }
        .send-mini-btn {
            width: 32px; height: 32px; border-radius: 50%; background: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .send-mini-btn svg { width: 16px; height: 16px; stroke: #000; fill: none; stroke-width: 2.5; }
        .btn-hangup { width: 56px; height: 56px; border-radius: 50%; background: var(--ios-red); display: flex; align-items: center; justify-content: center; }

        /* === 历史记录 (侧滑) === */
        .history-drawer {
            position: fixed; top: 0; left: 0; width: 80%; height: 100%;
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(25px);
            z-index: 2000; transform: translateX(-100%); transition: transform 0.4s ease;
            display: flex; flex-direction: column; padding: 60px 20px 40px;
        }
        .history-drawer.active { transform: translateX(0); }
        .history-item { font-size: 14px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .h-role { font-weight: 800; font-size: 11px; margin-bottom: 4px; color: #888; }

        /* === 设置弹窗 === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .config-card {
            width: 100%; max-width: 320px; background: rgba(255, 255, 255, 0.95);
            border-radius: 20px; padding: 24px; color: #1c1c1e; display: flex; flex-direction: column; gap: 14px;
        }
        .config-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; background: #f5f5f7; font-size: 14px; outline: none; }
        .save-btn { width: 100%; padding: 14px; border-radius: 12px; background: #000; color: #fff; font-weight: 600; border: none; }

        canvas#capture-canvas { display: none; }
    </style>
</head>
<body>

    <!-- 1. 待接听 -->
    <div id="incoming-call">
        <div style="display:flex; flex-direction:column; align-items:center;">
            <div class="caller-avatar"></div>
            <div class="incoming-name">宝宝</div>
            <div class="incoming-tip">正在邀请你视频通话...</div>
        </div>
        <div class="call-actions">
            <div class="action-btn" onclick="history.back()">
                <div class="icon-circle decline"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
                <span>挂断</span>
            </div>
            <div class="action-btn" onclick="acceptCall()">
                <div class="icon-circle accept"><svg viewBox="0 0 24 24"><path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94m-1 7.98v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
                <span>接听</span>
            </div>
        </div>
    </div>

    <!-- 2. 正式通话界面 -->
    <div id="video-container"><video id="video-el" autoplay playsinline></video></div>

    <div class="top-nav" id="top-nav">
        <div class="nav-btn" onclick="toggleHistory(true)"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg></div>
        <div class="center-info">
            <div class="caller-name">宝宝</div>
            <div class="call-timer" id="call-timer">00:00</div>
        </div>
        <div class="nav-btn" onclick="toggleConfig(true)"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
    </div>

    <div class="subtitle-area"><div class="subtitle-text" id="subtitle-el"></div></div>

    <div class="bottom-wrap" id="bottom-wrap">
        <div class="input-bar">
            <input type="text" class="chat-input" id="chat-input" placeholder="和TA说点什么..." autocomplete="off">
            <div class="send-mini-btn" onclick="handleSend()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg></div>
        </div>
        <div class="btn-hangup" onclick="history.back()"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
    </div>

    <div class="history-drawer" id="history-drawer" onclick="toggleHistory(false)">
        <div style="font-weight:800; font-size:12px; margin-bottom:20px; letter-spacing:2px; color:#666;">HISTORY LOG</div>
        <div class="history-list" id="history-list" onclick="event.stopPropagation()"></div>
    </div>

    <div class="modal-overlay" id="config-modal">
        <div class="config-card">
            <h3 style="text-align:center">API 设置</h3>
            <input type="text" class="config-input" id="api-url" placeholder="API URL">
            <input type="password" class="config-input" id="api-key" placeholder="API Key">
            <input type="text" class="config-input" id="api-model" placeholder="模型名称 (gpt-4o)">
            <textarea class="config-input" id="api-persona" style="height:80px" placeholder="输入人设描述..."></textarea>
            <button class="save-btn" onclick="saveSettings()">保存配置</button>
            <button class="save-btn" style="background:#eee; color:#333; margin-top:-5px" onclick="toggleConfig(false)">取消</button>
        </div>
    </div>

    <canvas id="capture-canvas"></canvas>

    <script>
        const video = document.getElementById('video-el');
        const canvas = document.getElementById('capture-canvas');
        const subtitleEl = document.getElementById('subtitle-el');
        const chatInput = document.getElementById('chat-input');
        
        // --- 1. 接听逻辑 ---
        async function acceptCall() {
            document.getElementById('incoming-call').style.opacity = '0';
            setTimeout(() => document.getElementById('incoming-call').style.display = 'none', 500);
            
            // 显示主界面
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('top-nav').style.display = 'grid';
            document.getElementById('bottom-wrap').style.display = 'flex';

            // 请求摄像头 (由于是点击触发，拦截率大大降低)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                startTimer();
            } catch (err) {
                alert("权限请求失败：请确保没有其他应用遮挡屏幕，并清理悬浮窗。");
            }
        }

        // --- 2. 视觉捕获 ---
        function getFrame() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
        }

        // --- 3. 字幕与历史 ---
        function setSubtitle(text) {
            subtitleEl.classList.remove('active');
            setTimeout(() => {
                subtitleEl.innerText = text;
                subtitleEl.classList.add('active');
            }, 300);
        }

        function addToLog(role, text) {
            const list = document.getElementById('history-list');
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<div class="h-role">${role}</div><div class="h-content">${text}</div>`;
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }

        // --- 4. API 请求 ---
        async function handleSend() {
            const text = chatInput.value.trim();
            if(!text) return;

            const config = JSON.parse(localStorage.getItem('hajimi_video_api') || '{}');
            if(!config.key) return alert("请设置 API Key");

            setSubtitle(text);
            addToLog('User', text);
            chatInput.value = '';
            chatInput.blur();

            const img = getFrame();
            let url = config.url || 'https://api.openai.com/v1';
            if (!url.endsWith('/chat/completions')) url = url.replace(/\/+$/, '') + '/chat/completions';

            const payload = {
                model: config.model || "gpt-4o",
                messages: [
                    { role: "system", content: (config.persona || "你正在和用户视频。") + "请观察画面回复，只输出对话，不要动作描述。" },
                    { role: "user", content: [
                        { type: "text", text: text },
                        { type: "image_url", image_url: { url: `data:image/jpeg;base64,${img}` } }
                    ]}
                ],
                max_tokens: 300
            };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.key}` },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                const aiText = data.choices[0].message.content;
                setTimeout(() => { setSubtitle(aiText); addToLog('Char', aiText); }, 600);
            } catch (e) { setSubtitle("信号不佳..."); }
        }

        // --- 5. UI 控制 ---
        function toggleHistory(s) { document.getElementById('history-drawer').classList.toggle('active', s); }
        function toggleConfig(s) { document.getElementById('config-modal').classList.toggle('active', s); }
        function saveSettings() {
            const c = { url: id('api-url').value, key: id('api-key').value, model: id('api-model').value, persona: id('api-persona').value };
            localStorage.setItem('hajimi_video_api', JSON.stringify(c));
            toggleConfig(false);
        }
        function id(name) { return document.getElementById(name); }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                let m = Math.floor(s/60).toString().padStart(2,'0');
                let sec = (s%60).toString().padStart(2,'0');
                id('call-timer').innerText = `${m}:${sec}`;
            }, 1000);
        }

        window.onload = () => {
            const c = JSON.parse(localStorage.getItem('hajimi_video_api') || '{}');
            id('api-url').value = c.url || ''; id('api-key').value = c.key || '';
            id('api-model').value = c.model || ''; id('api-persona').value = c.persona || '';
        };
        chatInput.addEventListener('keypress', e => { if(e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
